plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'  // ✅ Firebase plugin must be here
}

android {
    namespace = "com.example.text101"
    compileSdkVersion 33  // ✅ Replace flutter.compileSdkVersion with a fixed number
    ndkVersion "25.2.9519653"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.example.text101"
        minSdkVersion 21  // ✅ Replace flutter.minSdkVersion with a number
        targetSdkVersion 33  // ✅ Replace flutter.targetSdkVersion with a number
        versionCode 1  // ✅ Replace flutter.versionCode if needed
        versionName "1.0.0"  // ✅ Replace flutter.versionName if needed
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.9.0')  // ✅ Firebase BOM
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'  // ✅ If using Firebase Auth
    implementation 'com.google.firebase:firebase-firestore'  // ✅ If using Firestore
    implementation 'com.google.firebase:firebase-storage'  // ✅ If using Firebase Storage
}
